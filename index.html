<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.2);
            width: 90%;
            max-width: 450px;
            animation: fadeIn 1s ease-in-out;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ffb0c1;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #d81b60;
            box-shadow: 0 0 8px rgba(216, 27, 96, 0.3);
        }

        button {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-family: 'Poppins', sans-serif;
            margin-top: 15px;
            font-weight: bold;
        }

        button:hover {
            background-color: #ad1457;
            transform: scale(1.05);
        }

        #content-section {
            display: none; 
        }

        /* Estilo para el botón de Instagram */
        .ig-btn {
            display: inline-block;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(204, 35, 102, 0.4);
        }

        .ig-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div class="container" id="login-section">
        <h1 style="font-size: 2.5em;">Bienvenidos ❤️</h1>
        <p>Ingresa nuestros datos para entrar.</p>
        
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        
        <button onclick="verificarLogin()">Entrar</button>
        
        <p id="error-msg" style="color: #d81b60; display: none; margin-top: 15px; font-size: 14px;">
            Datos incorrectos. Intenta de nuevo.
        </p>
    </div>

    <!-- PANTALLA DE PERDÓN -->
    <div class="container" id="content-section">
        <h1 style="font-size: 3em;">Perdóname </h1>
        <p style="font-size: 1.1em; color: #555; margin-top: 20px;">
            Sé que me equivoqué y quiero pedirte disculpas de todo corazón. Eres demasiado importante para mí es para que no te rindas.
        </p>
        
        <!-- Reemplaza el enlace de abajo por el link real de tu Instagram -->
        <a href="Https://www.instagram.com/macarenos18?igsi=bXZ5MnJvMHptb2Fs&utm_source=qr" target="_blank" class="ig-btn">mira</a>
    </div>

    <script>
        function verificarLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // Credenciales que pediste
            if (user === 'akurutu' && pass === '28062026') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('content-section').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>

</body>
</html>
